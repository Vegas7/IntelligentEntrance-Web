<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta id="meta-theme" name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta id="meta-status" name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="智能通行">
  <meta name="referrer" content="no-referrer">
  <title>智能通行</title>
  <script>
    // 首帧前应用用户选择的主题，避免闪烁；theme-color 也在这里先定好（iOS 用它给状态栏着色）
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('ie.theme')); } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      var color = dark ? '#000000' : '#f2f2f7', root = document.documentElement;
      root.style.backgroundColor = color;
      root.style.colorScheme = dark ? 'dark' : 'light';
      document.getElementById('meta-theme').setAttribute('content', color);
      // iOS 27.2 起 iPhone Duo 的主屏幕 App：状态栏样式为 default 时页面止于状态栏侧栏（侧栏在页面外、颜色固定为打开时的），
      // 为 black-translucent 时页面铺到侧栏下面，侧栏由页面自己绘制、随主题实时变色。
      // 所以在 Duo 上不论深浅色都用 black-translucent；普通 iPhone 保持 default（iOS 26 顶部模糊的规避依赖它）。
      // 本次打开若已是页面外侧栏（恰好一边比窗口短 60–110px）即判定为 Duo，并记下来（app.js 写 ie.duoColumn）供以后打开时直接使用
      var duo = false, dw, dh;
      try { duo = JSON.parse(localStorage.getItem('ie.duoColumn')) === true; } catch (e) {}
      // iOS 27.2 的主屏幕 App 里 navigator.standalone 不再是 true，同时看 display-mode
      var standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
      if (standalone && /iPhone/.test(navigator.userAgent) && (duo || ((dw = outerWidth - innerWidth) >= 60 && dw <= 110 && Math.abs(outerHeight - innerHeight) < 4) || ((dh = outerHeight - innerHeight) >= 60 && dh <= 110 && Math.abs(outerWidth - innerWidth) < 4)))
        document.getElementById('meta-status').setAttribute('content', 'black-translucent');
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
  <link rel="icon" href="icon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <!-- 主屏幕图标：透明背景的小幽灵（实机对比白底 / 黑底 / 透明后选定透明版，源文件 icon-clear.svg） -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- iOS 26 主屏幕 Web App 顶部模糊的规避层（见 style.css .edge-guard） -->
  <div class="edge-guard" aria-hidden="true"></div>
  <!-- 折叠态 iPhone Duo 的 Safari 右侧浏览器栏取色用（见 style.css .edge-guard-right） -->
  <div class="edge-guard-right" aria-hidden="true"></div>
  <!-- 语言 / 主题切换按钮模板，登录页与通行页各放一组 -->
  <template id="tpl-prefs">
    <button type="button" class="icon-btn js-lang" data-i18n-aria="ui.lang">
      <!-- 「文A」语言图标：左上「文」、右下「A」，用线条绘制，不依赖字体 -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 2.3v1.9M2.6 5.2h9.8M10.6 5.2c-1 4.2-3.6 7.2-7.6 8.8M4.6 5.2c1 4 3.3 6.8 6.6 8.3"/><path d="M12.8 21.5 17.2 10.6l4.4 10.9M14.4 17.6h5.6"/></g></svg>
    </button>
    <button type="button" class="icon-btn js-theme" data-i18n-aria="ui.theme">
      <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M5.3 18.7l1.5-1.5M17.2 6.8l1.5-1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </template>

  <!-- ================= 登录 ================= -->
  <main id="view-login" class="view" hidden>
    <div class="login-prefs"><div class="glass-group js-prefs"></div></div>
    <div class="login-wrap">
      <img class="login-logo" src="icon.svg" alt="">
      <h1 class="login-title" data-i18n="app.title">智能通行</h1>
      <p class="login-sub" data-i18n="login.sub">轻量 Web 版 · 无广告 · 无需定位</p>

      <div class="tabs" role="tablist">
        <button class="tab is-active" role="tab" data-tab="pwd" data-i18n="login.tabPwd">密码登录</button>
        <button class="tab" role="tab" data-tab="sms" data-i18n="login.tabSms">验证码登录</button>
      </div>

      <form id="form-pwd" class="form" method="post" autocomplete="on">
        <label class="field">
          <span data-i18n="login.phone">手机号</span>
          <input id="pwd-phone" name="username" type="tel" inputmode="numeric" maxlength="11" autocomplete="username" data-i18n-placeholder="login.phonePh" required>
        </label>
        <label class="field">
          <span data-i18n="login.password">密码</span>
          <input id="pwd-password" name="password" type="password" autocomplete="current-password" data-i18n-placeholder="login.passwordPh" required>
        </label>
        <button class="btn btn-primary js-submit" type="submit" data-i18n="login.submit">登录</button>
      </form>

      <form id="form-sms" class="form" method="post" autocomplete="on" hidden>
        <label class="field">
          <span data-i18n="login.phone">手机号</span>
          <input id="sms-phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" data-i18n-placeholder="login.phonePh" required>
        </label>
        <label class="field">
          <span data-i18n="login.code">验证码</span>
          <div class="field-row">
            <input id="sms-code" type="text" inputmode="numeric" maxlength="8" autocomplete="one-time-code" data-i18n-placeholder="login.codePh" required>
            <button id="btn-send-sms" class="btn btn-tonal" type="button">获取验证码</button>
          </div>
        </label>
        <button class="btn btn-primary js-submit" type="submit" data-i18n="login.submit">登录</button>
      </form>

      <p id="login-msg" class="login-msg" role="status"></p>
      <p class="login-foot" data-i18n="login.foot">修改昵称 / 密码 / 注销账号等操作请使用原版 App</p>
    </div>
  </main>

  <!-- ================= 通行 ================= -->
  <main id="view-pass" class="view" hidden>
    <header class="topbar">
      <h1 id="building-name" class="topbar-title">智能通行</h1>
      <div class="topbar-tools">
        <div class="glass-group">
          <!-- 楼层列表切换（图标版）：仅在主屏幕 App 的透明侧栏模式下显示，替代楼层标题旁的文字按钮 -->
          <button id="btn-mode-icon" type="button" class="icon-btn mode-icon-btn" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.5 21 8l-9 4.5L3 8z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16l9 4.5 9-4.5"/></g></svg>
          </button>
          <div class="js-prefs"></div>
          <button id="btn-debug" class="icon-btn" data-i18n-aria="pass.debug" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8M9 4v3.5L4.5 17a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L15 7.5V4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 14h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <button id="btn-profile" class="avatar-btn" data-i18n-aria="pass.profile">
          <img src="ghost.svg?v=4" alt="">
        </button>
      </div>
    </header>

    <section class="qr-card" data-i18n-aria="pass.qr">
      <div class="qr-box">
        <canvas id="qr-canvas"></canvas>
        <div id="qr-placeholder" class="qr-placeholder"></div>
      </div>
      <div class="qr-meta">
        <span id="qr-floor" class="qr-floor"></span>
        <span id="qr-countdown" class="qr-countdown"></span>
        <button id="btn-refresh" class="icon-btn small" data-i18n-aria="pass.refresh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="qr-progress"><div id="qr-progress-bar"></div></div>
    </section>

    <div class="floor-head">
      <h2 id="floor-title"></h2>
      <button id="btn-mode" class="chip"></button>
    </div>
    <div class="floor-scroll">
      <div id="floor-grid" class="floor-grid" role="list"></div>
      <p id="floor-empty" class="floor-empty" hidden></p>
    </div>
  </main>

  <!-- ================= 个人中心 ================= -->
  <dialog id="sheet-profile" class="sheet">
    <div class="sheet-header">
      <h2 class="sheet-title" tabindex="-1" autofocus data-i18n="pass.profile">个人中心</h2>
      <div class="sheet-actions">
        <button type="button" class="sheet-btn sheet-close" data-close data-i18n-aria="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div class="profile-head">
      <img class="profile-avatar" src="ghost.svg?v=4" alt="">
      <div>
        <div id="profile-name" class="profile-name"></div>
        <div id="profile-phone" class="profile-phone"></div>
        <div id="profile-building" class="profile-building"></div>
      </div>
    </div>
    <div class="settings">
      <label class="setting">
        <span>
          <b data-i18n="profile.wakeLock">保持屏幕常亮</b>
          <small id="wake-status">停留在通行页时不自动锁屏</small>
        </span>
        <input id="set-wakelock" type="checkbox" class="switch">
      </label>
    </div>
    <button id="btn-logout" class="btn btn-row" data-i18n="profile.logout">退出登录 / 切换账号</button>
  </dialog>

  <!-- ================= 调试日志 ================= -->
  <dialog id="sheet-debug" class="sheet sheet-tall">
    <div class="sheet-header">
      <h2 class="sheet-title" tabindex="-1" autofocus data-i18n="debug.title">调试日志</h2>
      <div class="sheet-actions">
        <button id="btn-log-export" type="button" class="sheet-btn" data-i18n="debug.export">导出</button>
        <button id="btn-log-clear" type="button" class="sheet-btn" data-i18n="debug.clear">清空</button>
        <button type="button" class="sheet-btn sheet-close" data-close data-i18n-aria="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <div id="debug-list" class="debug-list"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/qrcode.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
